<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 64" width="830" height="64" role="img" aria-labelledby="t d">
  <title id="t">JARVIX typing banner</title>
  <desc id="d">A terminal-style line that types and erases short descriptions of JARVIX: its sections, its server-side AI proxy, its slash commands and its honest demo mode.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity=".7"/><stop offset=".5" stop-color="#3b82f6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".7"/></linearGradient>
    <style>
      .blinkc{animation:bl 1.1s steps(1) infinite}
      @keyframes bl{50%{opacity:.15}}
      .g0{animation:g0 20s linear infinite} .cv0,.cur0{animation:c0 20s linear infinite}
      .g1{animation:g1 20s linear infinite} .cv1,.cur1{animation:c1 20s linear infinite}
      .g2{animation:g2 20s linear infinite} .cv2,.cur2{animation:c2 20s linear infinite}
      .g3{animation:g3 20s linear infinite} .cv3,.cur3{animation:c3 20s linear infinite}
      @keyframes g0{0%{opacity:1}24.00%{opacity:1}24.99%{opacity:0}99.9%{opacity:0}100%{opacity:1}} @keyframes c0{0%,0.00%{transform:translateX(0)}7.50%{transform:translateX(573px)}19.50%{transform:translateX(573px)}24.00%{transform:translateX(0)}100%{transform:translateX(0)}} @keyframes g1{0%,24.99%{opacity:0}25.00%{opacity:1}49.00%{opacity:1}49.99%{opacity:0}100%{opacity:0}} @keyframes c1{0%,25.00%{transform:translateX(0)}32.50%{transform:translateX(470px)}44.50%{transform:translateX(470px)}49.00%{transform:translateX(0)}100%{transform:translateX(0)}} @keyframes g2{0%,49.99%{opacity:0}50.00%{opacity:1}74.00%{opacity:1}74.99%{opacity:0}100%{opacity:0}} @keyframes c2{0%,50.00%{transform:translateX(0)}57.50%{transform:translateX(470px)}69.50%{transform:translateX(470px)}74.00%{transform:translateX(0)}100%{transform:translateX(0)}} @keyframes g3{0%,74.99%{opacity:0}75.00%{opacity:1}99.00%{opacity:1}99.99%{opacity:0}100%{opacity:0}} @keyframes c3{0%,75.00%{transform:translateX(0)}82.50%{transform:translateX(447px)}94.50%{transform:translateX(447px)}99.00%{transform:translateX(0)}100%{transform:translateX(0)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x=".5" y=".5" width="829" height="63" rx="14" fill="#070b16" stroke="url(#edge)"/>
  <g fill="#22d3ee"><circle cx="24" cy="32" r="4" class="blinkc"/></g>
  <text x="38" y="38" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:19px;font-weight:700" fill="#22d3ee">&gt;</text>
  <g>
    <g class="g g0" style="opacity:1">
      <text x="56" y="39" textLength="559" lengthAdjust="spacing" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:19px;font-weight:500" fill="#d8e6ff">Chat · Tasks · Notes · Files · History · Activity</text>
      <rect class="cv cv0" x="52" y="14" width="569" height="36" fill="#070b16" style="transform:translateX(573px)"/>
      <rect class="cur cur0" x="53" y="17" width="2.5" height="30" rx="1.2" fill="#22d3ee" style="transform:translateX(573px)"/>
    </g>
    <g class="g g1" style="opacity:0">
      <text x="56" y="39" textLength="456" lengthAdjust="spacing" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:19px;font-weight:500" fill="#d8e6ff">Streaming AI through a server-side proxy</text>
      <rect class="cv cv1" x="52" y="14" width="466" height="36" fill="#070b16" style="transform:translateX(0px)"/>
      <rect class="cur cur1" x="53" y="17" width="2.5" height="30" rx="1.2" fill="#22d3ee" style="transform:translateX(0px)"/>
    </g>
    <g class="g g2" style="opacity:0">
      <text x="56" y="39" textLength="456" lengthAdjust="spacing" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:19px;font-weight:500" fill="#d8e6ff">Slash commands with real local utilities</text>
      <rect class="cv cv2" x="52" y="14" width="466" height="36" fill="#070b16" style="transform:translateX(0px)"/>
      <rect class="cur cur2" x="53" y="17" width="2.5" height="30" rx="1.2" fill="#22d3ee" style="transform:translateX(0px)"/>
    </g>
    <g class="g g3" style="opacity:0">
      <text x="56" y="39" textLength="433" lengthAdjust="spacing" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:19px;font-weight:500" fill="#d8e6ff">Demo mode that never pretends to be AI</text>
      <rect class="cv cv3" x="52" y="14" width="443" height="36" fill="#070b16" style="transform:translateX(0px)"/>
      <rect class="cur cur3" x="53" y="17" width="2.5" height="30" rx="1.2" fill="#22d3ee" style="transform:translateX(0px)"/>
    </g>
  </g>
</svg>
