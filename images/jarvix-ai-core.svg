<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-labelledby="t d">
  <title id="t">JARVIX AI core</title>
  <desc id="d">A glowing AI core with concentric rotating rings, orbiting nodes and slow pulses of energy.</desc>
  <defs>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".55" stop-color="#3b82f6" stop-opacity=".16"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="sph" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#cffafe"/><stop offset=".28" stop-color="#22d3ee"/><stop offset=".62" stop-color="#3b82f6"/><stop offset="1" stop-color="#5b21b6"/></radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <style>
      .r{transform-box:fill-box;transform-origin:center;animation:spin 48s linear infinite}
      .rev{animation-direction:reverse}
      .s1{animation-duration:80s} .s2{animation-duration:34s} .s3{animation-duration:22s} .s4{animation-duration:60s}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s ease-in-out infinite}
      .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 5.4s ease-out infinite}
      .tw{animation:tw 3.2s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.15);opacity:1}}
      @keyframes ripple{0%{transform:scale(.8);opacity:.6}100%{transform:scale(3.1);opacity:0}}
      @keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>

  <circle class="ripple" cx="210" cy="210" r="46" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
  <circle class="ripple" style="animation-delay:-1.8s" cx="210" cy="210" r="46" fill="none" stroke="#8b5cf6" stroke-width="1.3"/>
  <circle class="ripple" style="animation-delay:-3.6s" cx="210" cy="210" r="46" fill="none" stroke="#3b82f6" stroke-width="1.2"/>

  <g class="r s1"><circle cx="210" cy="210" r="192" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 11"/><circle cx="402" cy="210" r="5" fill="#67e8f9"/><circle cx="18" cy="210" r="5" fill="#a78bfa"/></g>
  <g class="r s4 rev"><circle cx="210" cy="210" r="172" fill="none" stroke="#3b82f6" stroke-opacity=".75" stroke-width="7" stroke-dasharray="1.6 8.17"/></g>
  <g class="r s2"><circle cx="210" cy="210" r="148" fill="none" stroke="url(#arc)" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="190 70 60 110 30 470"/></g>
  <g class="r s3 rev"><circle cx="210" cy="210" r="122" fill="none" stroke="#8b5cf6" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="120 80 40 120 24 383"/><circle cx="332" cy="210" r="4.5" fill="#c4b5fd"/><circle cx="88" cy="210" r="4.5" fill="#67e8f9"/></g>
  <circle cx="210" cy="210" r="98" fill="none" stroke="#3b82f6" stroke-opacity=".5" stroke-width="1"/>
  <g class="r s1"><polygon points="210,142 268.9,176 268.9,244 210,278 151.1,244 151.1,176" fill="none" stroke="#22d3ee" stroke-opacity=".6" stroke-width="1.3" stroke-linejoin="round"/></g>

  <circle class="pulse" cx="210" cy="210" r="70" fill="url(#halo)"/>
  <circle cx="210" cy="210" r="46" fill="url(#sph)"/>
  <ellipse cx="195" cy="193" rx="15" ry="9" fill="#fff" opacity=".42" transform="rotate(-28 195 193)"/>
  <circle cx="210" cy="210" r="46" fill="none" stroke="#cffafe" stroke-opacity=".35" stroke-width="1"/>

  <g stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"><path d="M210 4v16M210 400v16M4 210h16M400 210h16"/></g>
  <g fill="#67e8f9"><circle class="tw" cx="60" cy="86" r="2"/><circle class="tw" style="animation-delay:-1s" cx="352" cy="62" r="2.2"/><circle class="tw" style="animation-delay:-2s" cx="372" cy="338" r="1.8"/><circle class="tw" style="animation-delay:-.5s" cx="52" cy="330" r="2"/></g>
</svg>
