<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="1200" height="36" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58D6F5" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#58D6F5"/>
      <stop offset="0.5" stop-color="#398BFF"/>
      <stop offset="0.82" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brandV" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58D6F5"/><stop offset="1" stop-color="#398BFF"/></linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  </defs>

  <!-- rule, broken around the centre mark -->
  <rect x="0" y="17" width="556" height="2" rx="1" fill="url(#line)"/>
  <rect x="644" y="17" width="556" height="2" rx="1" fill="url(#line)"/>
  <g fill="#398BFF" fill-opacity="0.55">
    <rect x="150" y="12" width="2" height="12" rx="1"/><rect x="300" y="14" width="2" height="8" rx="1"/><rect x="450" y="12" width="2" height="12" rx="1"/>
    <rect x="748" y="12" width="2" height="12" rx="1"/><rect x="898" y="14" width="2" height="8" rx="1"/><rect x="1048" y="12" width="2" height="12" rx="1"/>
  </g>

  <!-- centre mark (the OPTIVEX hexagon) -->
  <g transform="translate(587 5) scale(0.26)">
    <path d="M50 4 L90 27 L90 73 L50 96 L10 73 L10 27 Z" fill="#0A1124" stroke="url(#brandV)" stroke-width="9" stroke-linejoin="round"/>
    <path d="M30 38 L50 66 L70 38" fill="none" stroke="#58D6F5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- travelling pulses -->
  <g class="motion">
    <circle cx="0" cy="18" r="6" fill="#58D6F5" opacity="0.7" filter="url(#glow)"><animate attributeName="cx" values="40;540" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.15;0.85;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="18" r="2.5" fill="#BFF3FF"><animate attributeName="cx" values="40;540" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="18" r="6" fill="#8B5CF6" opacity="0.7" filter="url(#glow)"><animate attributeName="cx" values="1160;660" dur="5s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.15;0.85;1" dur="5s" begin="-2.5s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="18" r="2.5" fill="#E4D9FF"><animate attributeName="cx" values="1160;660" dur="5s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="5s" begin="-2.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
