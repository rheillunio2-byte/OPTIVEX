    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity=".05"/></pattern>
    <clipPath id="frame"><rect width="1200" height="240" rx="22"/></clipPath>
    <style>
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite}
      .rev{animation-direction:reverse;animation-duration:20s}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s ease-in-out infinite}
      .bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 2.2s ease-in-out infinite}
      .sweep{animation:sweep 8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.18);opacity:1}}
      @keyframes bar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
      @keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1200px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>
