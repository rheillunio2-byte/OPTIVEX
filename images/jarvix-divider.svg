<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="1000" height="40" role="img" aria-labelledby="t d">
  <title id="t">JARVIX divider</title>
  <desc id="d">A thin glowing circuit line with a central diamond node and a light pulse travelling along it.</desc>
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".25" stop-color="#22d3ee" stop-opacity=".8"/><stop offset=".5" stop-color="#3b82f6"/><stop offset=".75" stop-color="#8b5cf6" stop-opacity=".8"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
    <linearGradient id="pl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67e8f9" stop-opacity="0"/><stop offset=".7" stop-color="#67e8f9"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".6"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <style>
      .travel{animation:travel 5.5s cubic-bezier(.45,0,.55,1) infinite}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
      .tw{animation:tw 3s ease-in-out infinite}
      @keyframes travel{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(780px);opacity:0}}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.35);opacity:1}}
      @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="40" y="19" width="920" height="2" rx="1" fill="url(#ln)"/>
  <rect class="travel" x="100" y="18.5" width="120" height="3" rx="1.5" fill="url(#pl)"/>
  <g fill="none" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430 20h-26l-8-8h-34M570 20h26l8-8h34M430 20h-26l-8 8h-34M570 20h26l8 8h34"/>
  </g>
  <g fill="#22d3ee"><circle class="tw" cx="362" cy="12" r="2"/><circle class="tw" style="animation-delay:-1s" cx="362" cy="28" r="2"/><circle class="tw" style="animation-delay:-.5s" cx="638" cy="12" r="2"/><circle class="tw" style="animation-delay:-1.5s" cx="638" cy="28" r="2"/></g>
  <circle class="pulse" cx="500" cy="20" r="16" fill="url(#gl)"/>
  <rect x="493" y="13" width="14" height="14" rx="2" fill="#071022" stroke="#22d3ee" stroke-width="1.5" transform="rotate(45 500 20)"/>
  <circle cx="500" cy="20" r="2.6" fill="#67e8f9"/>
</svg>
