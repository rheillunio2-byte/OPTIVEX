<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">JARVIX — AI Command Center</title>
  <desc id="d">Animated JARVIX banner: a glowing AI core with rotating rings beside the JARVIX wordmark and the tagline “Your Intelligence. Your Assistant. Your JARVIX.”</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03050a"/><stop offset=".55" stop-color="#071022"/><stop offset="1" stop-color="#0e1235"/></linearGradient>
    <linearGradient id="ti" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67e8f9"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".38"/><stop offset=".6" stop-color="#3b82f6" stop-opacity=".12"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="sph" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#cffafe"/><stop offset=".28" stop-color="#22d3ee"/><stop offset=".62" stop-color="#3b82f6"/><stop offset="1" stop-color="#5b21b6"/></radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".85" stop-color="#22d3ee" stop-opacity=".10"/><stop offset="1" stop-color="#67e8f9" stop-opacity=".35"/></linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity=".055"/></pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
    <style>
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 42s linear infinite}
      .spin2{animation-duration:26s;animation-direction:reverse}
      .spin3{animation-duration:64s}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s ease-in-out infinite}
      .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 4.8s ease-out infinite}
      .tw{animation:tw 4s ease-in-out infinite}
      .flow{stroke-dasharray:6 14;animation:flow 2.2s linear infinite}
      .sweep{animation:sweep 7s linear infinite}
      .blink{animation:tw 2.4s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.14);opacity:1}}
      @keyframes ripple{0%{transform:scale(.9);opacity:.55}100%{transform:scale(2.5);opacity:0}}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
      @keyframes flow{to{stroke-dashoffset:-20}}
      @keyframes sweep{0%{transform:translateY(-110px)}100%{transform:translateY(340px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="230" cy="170" r="260" fill="url(#glow)"/>
    <circle cx="1030" cy="60" r="200" fill="#8b5cf6" opacity=".07"/>

    <g fill="none" stroke="#22d3ee" stroke-opacity=".42" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path class="flow" d="M1200 52H1060L1030 82H900"/>
      <path class="flow" style="animation-delay:-.8s" d="M1200 292H1090L1062 264H960"/>
      <path class="flow" style="animation-delay:-1.4s" d="M360 24H470L492 46H560"/>
      <path class="flow" style="animation-delay:-.4s" d="M330 326H402L424 312H468"/>
    </g>
    <g fill="#22d3ee"><circle cx="900" cy="82" r="3"/><circle cx="960" cy="264" r="3"/><circle cx="560" cy="46" r="3"/><circle cx="468" cy="312" r="3"/></g>

    <g>
    <circle class="tw" style="animation-delay:0.00s" cx="612" cy="52" r="1.8" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:0.55s" cx="700" cy="300" r="1.2" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:1.10s" cx="880" cy="40" r="1.2" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:1.65s" cx="1010" cy="310" r="1.8" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:2.20s" cx="1120" cy="150" r="1.2" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:2.75s" cx="540" cy="310" r="1.2" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:3.30s" cx="980" cy="100" r="1.8" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:3.85s" cx="760" cy="64" r="1.2" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:0.40s" cx="1150" cy="260" r="1.2" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:0.95s" cx="470" cy="40" r="1.8" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:1.50s" cx="330" cy="40" r="1.2" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:2.05s" cx="120" cy="40" r="1.2" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:2.60s" cx="70" cy="290" r="1.8" fill="#67e8f9"/>
    <circle class="tw" style="animation-delay:3.15s" cx="360" cy="300" r="1.2" fill="#67e8f9"/>
    </g>

    <!-- AI core -->
    <g>
      <circle class="ripple" cx="230" cy="170" r="52" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
      <circle class="ripple" style="animation-delay:-2.4s" cx="230" cy="170" r="52" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
      <g class="spin spin3"><circle cx="230" cy="170" r="132" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 9"/><circle cx="362" cy="170" r="4" fill="#67e8f9"/><circle cx="98" cy="170" r="4" fill="#a78bfa"/></g>
      <g class="spin"><circle cx="230" cy="170" r="108" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="150 60 40 90 20 319"/></g>
      <g class="spin spin2"><circle cx="230" cy="170" r="84" fill="none" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="90 70 30 100 20 218"/><circle cx="314" cy="170" r="3.5" fill="#c4b5fd"/><circle cx="146" cy="170" r="3.5" fill="#67e8f9"/></g>
      <circle cx="230" cy="170" r="64" fill="none" stroke="#3b82f6" stroke-opacity=".55" stroke-width="1"/>
      <circle class="pulse" cx="230" cy="170" r="48" fill="url(#glow)" opacity=".9"/>
      <circle cx="230" cy="170" r="38" fill="url(#sph)"/>
      <ellipse cx="217" cy="156" rx="13" ry="8" fill="#fff" opacity=".42" transform="rotate(-28 217 156)"/>
      <g stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.2"><path d="M230 24v14M230 302v14M84 170h14M362 170h14"/></g>
    </g>

    <!-- wordmark -->
    <text x="420" y="96" textLength="300" lengthAdjust="spacing" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:15px;font-weight:600" fill="#22d3ee">AI · COMMAND · CENTER</text>
    <text x="414" y="196" textLength="600" lengthAdjust="spacing" style="font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:116px;font-weight:800" fill="url(#ti)">JARVIX</text>
    <text x="420" y="246" textLength="590" lengthAdjust="spacing" style="font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:24px;font-weight:500" fill="#b6c6e3">Your Intelligence. Your Assistant. Your JARVIX.</text>

    <g style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:12px;font-weight:600" letter-spacing="1">
      <rect x="420" y="274" width="128" height="26" rx="13" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".45"/>
      <circle class="blink" cx="437" cy="287" r="3.5" fill="#22d3ee"/><text x="448" y="291" fill="#9eeaf7">LOCAL-FIRST</text>
      <rect x="558" y="274" width="164" height="26" rx="13" fill="#3b82f6" fill-opacity=".08" stroke="#3b82f6" stroke-opacity=".5"/>
      <circle class="blink" style="animation-delay:-.8s" cx="575" cy="287" r="3.5" fill="#60a5fa"/><text x="586" y="291" fill="#a9c8fb">SERVER-SIDE KEYS</text>
      <rect x="732" y="274" width="130" height="26" rx="13" fill="#8b5cf6" fill-opacity=".09" stroke="#8b5cf6" stroke-opacity=".5"/>
      <circle class="blink" style="animation-delay:-1.6s" cx="749" cy="287" r="3.5" fill="#a78bfa"/><text x="760" y="291" fill="#cdbffc">VOICE-READY</text>
    </g>

    <rect class="sweep" transform="translate(0 -110)" x="0" y="0" width="1200" height="110" fill="url(#scan)"/>

    <g fill="none" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round">
      <path d="M20 44V26a6 6 0 0 1 6-6h18M1180 44V26a6 6 0 0 0-6-6h-18M20 296v18a6 6 0 0 0 6 6h18M1180 296v18a6 6 0 0 1-6 6h-18"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="21.5" fill="none" stroke="#22d3ee" stroke-opacity=".22"/>
</svg>
