<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img" aria-labelledby="sys-title sys-desc">
  <title id="sys-title">Illustration of the OPTIVEX system health monitor</title>
  <desc id="sys-desc">An illustrative animation: four status tiles for CPU, memory, storage and temperature, and a live-style chart. It shows no real data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070C18"/><stop offset="1" stop-color="#101437"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58D6F5"/><stop offset="0.55" stop-color="#398BFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58D6F5" stop-opacity="0.28"/><stop offset="1" stop-color="#58D6F5" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="chart"><rect x="55" y="206" width="890" height="126"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .static { display: none; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } .static { display: inline; } }
    </style>
  </defs>
